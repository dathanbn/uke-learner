name: Deploy to GitHub Pages

on:
  push:
    # This repo's default branch is the claude/* one — it was the first branch pushed to
    # an empty repo, so GitHub made it the default. `main` is listed too so this keeps
    # working if the branch is ever renamed or a main is created.
    branches:
      - main
      - claude/chord-learning-spaced-repetition-gfrkd6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GITHUB_PAGES switches the Vite base to /uke-learner/. Without it every asset 404s
      # on a project site — the single most common Pages deploy bug.
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

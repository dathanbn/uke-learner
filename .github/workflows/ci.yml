name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Enforces the detector accuracy floor: >=95% true-accept, <=2% false-accept.
      # The confusion matrix is printed in the job log.
      - run: npm run test
